<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Préstamos Material</title>
    <link rel="icon" href="logC.png" type="image/png">
    <link rel="preconect" href="https://fonts.googleapis.com"> 
    <link rel="preconect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:
    wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>

<!-- Encabezado -->
<body>

  <div class="encabezado" role="banner">
    <div class="marca">
     <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
      <rect width="34" height="34" rx="9" fill="var(--pcb)"/>
      <path d="M5 17h5l2-6 4 12 4-12 2 6h7" fill="none" stroke="var(--pcb-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    
      <div>
        Almacen de Prestamos
        <div class="marca-subtitulo">Ingeniería en Telemática, CUSur</div>
      </div>
    </div>

  <div class="menu">
    <span class="sesion" id="who" hidden></span>
    <button class="boton boton-secundario" id="btn-Report" type="button">Reportar un Problema</button>
    <button class="boton boton-principal" id="btn-Login" type="button">Iniciar Sesión</button>
  </div>
  </div>

  <div role="main">
    <div class="portada">
      <div>
        <h1 class="titulo-principal">Gestión de Préstamos de Material</h1>
        <p class="subtitulo">Bienvenido al sistema de gestión de préstamos de material. Aquí podrás solicitar, devolver y consultar
          el estado de los materiales disponibles.</p>
        <label for="q" class="solo-lectores">Buscar Materiales</label>
        <input class="buscador" id="q" type="search" placeholder="Ej. Resistencia 330k, multímetro, cable de red" autocomplete="off">
        <div class="atajos" id="quick" aria-label="Busquedas rapidas"></div>
    </div>
  </div>

  <div class="galeria">
    <div class="galeria-imagen" id="stage"></div>
    <div class="galeria-miniaturas" id="thumbs" role="group" aria-label="Galería de Imágenes"></div>
    <div class="galeria-pie" id="galCap" aria-live="polite"></div>
  </div>

  
</html>
